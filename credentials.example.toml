# Copy to credentials.toml (gitignored) and fill in.
# Any value can also be set with an environment variable, which wins over this file:
#   GARMIN_EMAIL, GARMIN_PASSWORD, BOOSTCAMP_EMAIL, BOOSTCAMP_PASSWORD,
#   GBSYNC_TIMEZONE, GBSYNC_DATA_DIR, GBSYNC_INTERVAL_HOURS, GBSYNC_LOOKBACK_DAYS

[garmin]
email = "you@example.com"
password = "change-me"

[boostcamp]
email = "you@example.com"
password = "change-me"

[sync]
# IANA timezone you train in. Used to bucket workouts by local date.
timezone = "America/New_York"
# Where tokens, state and MFA handoff files live (a Docker volume in prod).
data_dir = "data"
# How often the daemon runs a sync.
interval_hours = 24
# How many days back each sync looks.
lookback_days = 7
# When both sides have start times, max gap allowed between them.
match_window_minutes = 120
# File-based MFA: how long the daemon waits for data/mfa_code before giving up this cycle.
mfa_wait_minutes = 10
